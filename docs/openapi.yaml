          schema:
            type: string
            format: uuid
        - name: kelasId
          in: query
          schema:
            type: string
            format: uuid
        - name: periode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Raport records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Raport'

  /api/template-raport:
    get:
      tags: [Raport]
      summary: List raport templates
      parameters:
        - name: sekolahId
          in: query
          schema:
            type: string
            format: uuid
        - name: jenjang
          in: query
          schema:
            type: string
        - name: kurikulum
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Raport templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RaportTemplate'

# ============================================================
# Components
# ============================================================
components:

  # ============================================================
  # Security Schemes
  # ============================================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from NextAuth session

    SessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie

  # ============================================================
  # Schemas
  # ============================================================
  schemas:

    # ---- Common ----
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
          example: UNAUTHORIZED
        details:
          type: object
          additionalProperties: true

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8

    # ---- Auth ----
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nama_lengkap:
          type: string
          example: Budi Santoso
        phone:
          type: string
          example: "+6281234567890"
        role:
          type: string
          enum: [user, admin, superadmin]
        status_langganan:
          type: string
          example: plan_premium_annual
        subscription_status:
          type: string
          enum: [active, inactive, grace_period]
        subscription_end:
          type: string
          format: date-time
        quota_poin_total:
          type: integer
        quota_poin_used:
          type: integer
        referral_code:
          type: string
          example: GPRO-ABC12
        is_active:
          type: boolean
        account_type:
          type: string
          enum: [individual, institution]
        institution_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        institutionId:
          type: integer
          nullable: true

    # ---- Financial ----
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        external_id:
          type: string
        amount:
          type: number
          format: float
          example: 299000
        currency:
          type: string
          example: IDR
        status:
          type: string
          enum: [PENDING, PAID, ACTIVATED, EXPIRED, DENIED, REFUNDED]
        payment_method:
          type: string
          example: XENDIT
        plan_id:
          type: string
          example: plan_premium_annual
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PayoutRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tipe:
          type: string
          enum: [cashback, reward]
        jumlah:
          type: integer
          description: Amount in IDR
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, PAID]
        bank_name:
          type: string
        bank_account_number:
          type: string
        bank_account_name:
          type: string
        catatan:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ---- Institutions ----
    Institution:
      type: object
      properties:
        id:
          type: integer
        nama:
          type: string
          example: SD Negeri 1 Jakarta
        jalur_regulasi:
          type: string
          enum: [kemendikdasmen, kemenag]
        jenjang:
          type: string
          enum: [paud, sd_mi, smp_mts, sma_ma, smk_mak]
        kurikulum:
          type: string
          enum: [kurikulum_merdeka, k13, kbc, hybrid]
        alamat:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ---- Settings ----
    PaymentGatewayConfig:
      type: object
      properties:
        default_gateway:
          type: string
          enum: [xendit, midtrans, duitku, mock]
        xendit:
          type: object
          properties:
            api_key:
              type: string
            verification_token:
              type: string
            is_sandbox:
              type: boolean
        midtrans:
          type: object
          properties:
            merchant_id:
              type: string
            client_key:
              type: string
            server_key:
              type: string
            is_sandbox:
              type: boolean
        duitku:
          type: object
          properties:
            merchant_code:
              type: string
            api_key:
              type: string
            is_sandbox:
              type: boolean

    EmailSenderConfig:
      type: object
      properties:
        provider:
          type: string
          enum: [smtp, resend, sendgrid]
        active:
          type: boolean
        smtp:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
            secure:
              type: boolean
            user:
              type: string
            pass:
              type: string
        sender_name:
          type: string
        sender_email:
          type: string

    WaSenderConfig:
      type: object
      properties:
        provider:
          type: string
          enum: [fonnte, ruangwa]
        active:
          type: boolean
        fonnte:
          type: object
          properties:
            token:
              type: string
            sender_number:
              type: string
        ruangwa:
          type: object
          properties:
            token:
              type: string
            sender_number:
              type: string

    AiConfig:
      type: object
      properties:
        default_vendor:
          type: string
          enum: [gemini, openai, claude, deepseek, mock]
        gemini:
          type: object
          properties:
            api_key:
              type: string
            model_name:
              type: string
              example: gemini-2.5-flash
        openai:
          type: object
          properties:
            api_key:
              type: string
            model_name:
              type: string
        claude:
          type: object
          properties:
            api_key:
              type: string
            model_name:
              type: string
        deepseek:
          type: object
          properties:
            api_key:
              type: string
            model_name:
              type: string

    # ---- Storage ----
    UserFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: document.pdf
        r2_key:
          type: string
        r2_url:
          type: string
          format: uri
        size:
          type: integer
          format: int64
        mime_type:
          type: string
          example: application/pdf
        folder_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    UserFolder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    # ---- Attendance ----
    AttendanceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        institution_id:
          type: integer
        date:
          type: string
          format: date
        check_in_time:
          type: string
          format: date-time
          nullable: true
        check_out_time:
          type: string
          format: date-time
          nullable: true
        attendance_status:
          type: string
          enum: [present, absent, late, permit]
        late_minutes:
          type: integer
          nullable: true
        teaching_sessions_completed:
          type: integer
        teaching_minutes_total:
          type: integer

    # ---- Journals ----
    TeachingJournal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        tanggal:
          type: string
          format: date
        materi_pembelajaran:
          type: string
        tujuan_pembelajaran:
          type: string
        aktivitas_pembelajaran:
          type: string
        media_pembelajaran:
          type: string
          nullable: true
        asesmen_pembelajaran:
          type: string
          nullable: true
        refleksi_guru:
          type: string
          nullable: true
        tindak_lanjut:
          type: string
          nullable: true
        evidensi:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [Draft, Submitted, Approved, Revision]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TeachingJournalInput:
      type: object
      required: [class_id, subject_id, tanggal, materi_pembelajaran, tujuan_pembelajaran, aktivitas_pembelajaran]
      properties:
        class_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        tanggal:
          type: string
          format: date
        materi_pembelajaran:
          type: string
        tujuan_pembelajaran:
          type: string
        aktivitas_pembelajaran:
          type: string
        media_pembelajaran:
          type: string
        asesmen_pembelajaran:
          type: string
        refleksi_guru:
          type: string
        tindak_lanjut:
          type: string
        evidensi:
          type: array
          items:
            type: string
        custom_values:
          type: object
        status:
          type: string
          enum: [Draft, Submitted]

    JournalSchema:
      type: object
      properties:
        id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        nama_skema:
          type: string
          example: Jurnal Mengajar Harian
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              label:
                type: string
              type:
                type: string
                enum: [text, textarea, date, select, file, number]
              required:
                type: boolean
              options:
                type: array
                items:
                  type: string

    # ---- Performance Share ----
    PerformanceShareDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, institution, private]
        documents:
          type: array
          items:
            type: object
            properties:
              file_id:
                type: string
                format: uuid
              name:
                type: string
              url:
                type: string
                format: uri
        access_grants:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              granted_at:
                type: string
                format: date-time
        token:
          type: string
          description: Public share token
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ---- AI ----
    AiAlert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        severity:
          type: string
          enum: [info, warning, critical]
        message:
          type: string
        feature:
          type: string
        user_id:
          type: string
          format: uuid
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    # ---- Raport ----
    Raport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siswa_id:
          type: string
          format: uuid
        kelas_id:
          type: string
          format: uuid
        template_raport_id:
          type: string
          format: uuid
        periode:
          type: string
          example: "2025/2026 Ganjil"
        jenis_laporan:
          type: string
          enum: [tengah_semester, akhir_semester, kokurikuler_p5, kokurikuler_p2ra]
        status:
          type: string
          enum: [draft, dikirim_ke_wali_kelas, dikonfirmasi, difinalisasi, siap_print]
        created_at:
          type: string
          format: date-time

    RaportTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sekolah_id:
          type: string
          format: uuid
        nama_template:
          type: string
        jalur_regulasi:
          type: string
          enum: [kemendikdasmen, kemenag]
        jenjang:
          type: string
          enum: [paud, sd_mi, smp_mts, sma_ma, smk_mak]
        kurikulum:
          type: string
          enum: [kurikulum_merdeka, k13, kbc, hybrid]
        jenis_laporan:
          type: string
        sections:
          type: array
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
